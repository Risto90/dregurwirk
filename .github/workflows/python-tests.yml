name: python-tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # LWJGL3 always creates a GL context, so the game needs a display even in
  # minimized mode. Force the Mesa software rasterizer under Xvfb.
  LIBGL_ALWAYS_SOFTWARE: "1"
  XVFB_ARGS: "-screen 0 1024x768x24"

jobs:
  run-tests:
    name: Run Python HTTP API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init luaj submodule
        run: git submodule update --init --depth 1 luaj

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests lxml

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglu1-mesa

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare log directory
        run: mkdir -p /tmp/logs

      - name: Compile desktop sources
        run: ./gradlew -p RemixedDungeonDesktop classes

      # --- Suites that start and stop their own game server ---

      - name: Run Blood Transfusion Tests
        run: |
          set -o pipefail
          if ! xvfb-run -a --server-args="$XVFB_ARGS" python3 tests/http_api/test_blood_transfusion.py 2>&1 | tee /tmp/logs/blood_transfusion.log; then
            bash tests/http_api/ci_report_failure.sh /tmp/logs/blood_transfusion.log
            exit 1
          fi
        timeout-minutes: 20

      - name: Run Level Navigation Tests
        run: |
          set -o pipefail
          if ! xvfb-run -a --server-args="$XVFB_ARGS" python3 tests/http_api/test_level_navigation.py 2>&1 | tee /tmp/logs/level_navigation.log; then
            bash tests/http_api/ci_report_failure.sh /tmp/logs/level_navigation.log
            exit 1
          fi
        timeout-minutes: 20

      # --- Suites that expect a WebServer to be already running on port 8080 ---

      - name: Start shared WebServer
        run: |
          nohup xvfb-run -a --server-args="$XVFB_ARGS" \
            ./gradlew -p RemixedDungeonDesktop runDesktopGameWithWebServer \
            --args="--webserver=8080 --minimized" > /tmp/logs/webserver.log 2>&1 &
          echo $! > /tmp/webserver.pid
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/ready 2>/dev/null | grep -q '"ready"[[:space:]]*:[[:space:]]*true'; then
              echo "WebServer is ready"
              # /ready only means the game loop is running; building the first
              # game costs another minute on a cold JVM. Do it now so the
              # suites do not time out on it.
              # The first start_game after boot is lost while the engine is
              # still switching to its initial scene, so keep asking.
              for j in $(seq 1 12); do
                curl -sf "http://localhost:8080/debug/start_game?class=WARRIOR&difficulty=0" > /dev/null || true
                for k in $(seq 1 10); do
                  if curl -sf http://localhost:8080/debug/get_game_state 2>/dev/null | grep -q '"hero"'; then
                    echo "First game built after ${j} start_game call(s)"
                    exit 0
                  fi
                  sleep 2
                done
              done
              echo "::error::WebServer became ready but never built a game"
              exit 1
            fi
            sleep 2
          done
          echo "::error::WebServer did not become ready within 240s"
          echo "::error::$(tail -c 900 /tmp/logs/webserver.log | tr '\n\r' '  ')"
          tail -n 100 /tmp/logs/webserver.log
          exit 1
        timeout-minutes: 10

      - name: Run Doctor Spells Tests
        run: |
          set -o pipefail
          if ! python3 tests/http_api/test_doctor_spells.py 2>&1 | tee /tmp/logs/doctor_spells.log; then
            bash tests/http_api/ci_report_failure.sh /tmp/logs/doctor_spells.log
            exit 1
          fi
        timeout-minutes: 15

      - name: Run All Spells Tests
        run: |
          set -o pipefail
          if ! python3 tests/http_api/test_all_spells.py 2>&1 | tee /tmp/logs/all_spells.log; then
            bash tests/http_api/ci_report_failure.sh /tmp/logs/all_spells.log
            exit 1
          fi
        timeout-minutes: 15

      - name: Run Alchemy Tests
        run: |
          set -o pipefail
          if ! python3 tests/http_api/test_alchemy.py 2>&1 | tee /tmp/logs/alchemy.log; then
            bash tests/http_api/ci_report_failure.sh /tmp/logs/alchemy.log
            exit 1
          fi
        timeout-minutes: 15

      - name: Stop shared WebServer
        if: always()
        run: |
          if [ -f /tmp/webserver.pid ]; then kill "$(cat /tmp/webserver.pid)" 2>/dev/null || true; fi
          pkill -f runDesktopGameWithWebServer 2>/dev/null || true
          pkill -f DesktopLauncher 2>/dev/null || true

      - name: Surface WebServer log on failure
        if: failure()
        run: |
          echo "::error::$(tail -c 900 /tmp/logs/webserver.log 2>/dev/null | tr '\n\r' '  ')"
          tail -n 200 /tmp/logs/webserver.log || true

      - name: Collect suite server logs
        if: always()
        run: cp /tmp/*_test_*.log /tmp/logs/ 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/logs/
          if-no-files-found: ignore
